[metadata]
name = benchmark
author = Corentin Lepessec
author_email = clepessec@free.free
version = 1.0
license_file = LICENSE
license = MIT
description = Bibliothèque de calcul de matrices creuses
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >= 3.9
install_requires =
    numpy
    scipy
    matplotlib
    memory_profiler
    IPython
    pympler
    line_profiler

[options.extras_require]
test =
    pytest

[options.entry_points]
console_scripts =
    benchCOO = benchmark.__main__:main

[tool:pytest]
addopts = --doctest-modules --doctest-report ndiff
doctest_optionflags = NORMALIZE_WHITESPACE